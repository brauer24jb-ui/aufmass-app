workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup (The Override)
        script: |
          keychain initialize
          
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" | head -n 1)
          
          security cms -D -i "$PROFILE_PATH" > profile.plist
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile.plist)
          
          echo "Gefundene Team-ID: $TEAM_ID"
          echo "Gefundene Profil-UUID: $PROFILE_UUID"
          
          echo "FLUTTER_XCODE_DEVELOPMENT_TEAM=$TEAM_ID" >> $CM_ENV
          echo "FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" >> $CM_ENV
          echo "FLUTTER_XCODE_CODE_SIGN_STYLE=Manual" >> $CM_ENV
          echo "FLUTTER_XCODE_CODE_SIGN_IDENTITY=Apple Distribution" >> $CM_ENV
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # HIER IST DER FIX: Einfach ein sauberer Build ohne fehlende Dateien!
          flutter build ipa --release
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa