workflows:
  default-workflow:
    name: Aufmass App Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing (Native Bypass)
        script: |
          keychain initialize
          
          # 1. Holt AUSSCHLIESSLICH das App Store Zertifikat
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. RUBY INJECTION: Macht Xcode gewaltsam gefügig
          gem install xcodeproj
          cat <<EOF > fix_xcode.rb
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          attributes = project.root_object.attributes['TargetAttributes']
          if attributes
            attributes.each do |target_id, settings|
              settings['ProvisioningStyle'] = 'Manual'
            end
          end
          
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('DEVELOPMENT_TEAM')
            end
          end
          project.save
          EOF
          ruby fix_xcode.rb
          
          # 3. Codemagic trägt Zertifikat und Team-ID jetzt in ein 100% sauberes Projekt ein
          xcode-project use-profiles
          
      - name: Compile Flutter (NO SIGNING)
        script: |
          flutter clean
          flutter pub get
          # HIER IST DER SCHLÜSSEL: Flutter kompiliert nur, darf aber NICHT signieren!
          flutter build ios --release --no-codesign
          
      - name: Archive and Sign (Codemagic Native)
        script: |
          # Codemagic schnappt sich den unverschlüsselten Code und signiert ihn fehlerfrei selbst
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
            
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa