workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # Codemagic hat jetzt wieder Platz bei Apple und generiert ein komplett frisches Zertifikat samt Private Key!
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Compile Flutter (NO SIGNING)
        script: |
          flutter clean
          flutter pub get
          # Wir verbieten Flutter das Signieren, damit es keine unsinnigen Dev-Zertifikate mehr fordert
          flutter build ios --release --no-codesign
          
      - name: Archive and Sign (Codemagic Native)
        script: |
          # Codemagic schnürt das Paket und klebt das frische Zertifikat absolut fehlerfrei drauf
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
            
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa