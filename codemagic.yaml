workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: Build Flutter Assets (No Signing)
        script: |
          flutter clean
          flutter pub get
          # 1. Flutter bereitet alles vor, installiert Plugins und baut den Code. 
          # WICHTIG: Er signiert noch NICHT, damit er nicht abstürzt!
          flutter build ios --release --no-codesign
          
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # 2. JETZT, wo Flutter fertig ist, holen wir das Zertifikat
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 3. Codemagic trägt das Profil in das Projekt ein (Flutter kann es jetzt nicht mehr überschreiben!)
          xcode-project use-profiles
          
      - name: Archive and Export IPA (Codemagic Native)
        script: |
          # 4. Codemagic schnürt das Paket mit dem frisch eingetragenen Zertifikat
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
            
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa