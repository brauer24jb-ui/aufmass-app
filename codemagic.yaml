workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Set up code signing settings
        script: |
          # Direktes Entschlüsseln und Schreiben des Private Keys
          mkdir -p ~/.appstoreconnect/private_keys
          echo "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JR1RBZ0VBTUJNR0J5cUdTTTQ5QWdFR0NDcUdTTTQ5QXdFQkhCa3dkd0lCQVFxTUFYZ1MzL0JXTjA5R0RpCnRBN2o4UkxaaXpYUWZrdW5aZkdKUnJBSDRpZ0N5SUtvWklqMERBcWhSQU5DQUFSRlFka0JxcUlWckhxCmpYM0pWOTdkamtJTFFqNzNtUEh2dXAzdTBQUTd3K211azNLcnRrOEZLa1dGZHg3bjhGOG1hdm5WNXUtRHppZ0ZEbVUK-----END PRIVATE KEY-----" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_A94DCGUAQR.p8
          
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --issuer-id "DEINE_ISSUER_ID_HIER_EINTRAGEN" \
            --key-id "A94DCGUAQR" \
            --private-key ~/.appstoreconnect/private_keys/AuthKey_A94DCGUAQR.p8
      - name: Flutter build iOS
        script: |
          cd flutter_application_1
          flutter build ipa --release
      - name: Upload to App Store Connect / TestFlight
        script: |
          app-store-connect publish \
            --issuer-id "0c97516d-8c75-47bf-b14e-6a55ca16ec07" \
            --key-id "A94DCGUAQR" \
            --private-key ~/.appstoreconnect/private_keys/AuthKey_A94DCGUAQR.p8 \
            --ipa "flutter_application_1/build/ios/ipa/*.ipa"
    artifacts:
      - flutter_application_1/build/ios/ipa/*.ipa