workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
      
      # Die Magie: Holt die (jetzt existierenden) Profile und generiert die export_options.plist!
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nordwest.aufmassapp
        
    scripts:
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # Flutter nutzt jetzt die von Codemagic generierte Datei und baut sauber durch
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa