workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # 1. Wir holen NUR das finale App Store Zertifikat. Kein nerviges Dev-Zertifikat mehr nötig!
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. Codemagic trägt das Zertifikat sauber in deine reparierte Werks-Datei ein
          xcode-project use-profiles
          
      - name: Build Flutter Assets (No Signing)
        script: |
          flutter clean
          flutter pub get
          
          # 3. Flutter bereitet den Code vor, DARF ABER NICHT SIGNIEREN! (Umgeht den sturen Fehler)
          flutter build ios --release --no-codesign
          
      - name: Archive and Export IPA (Codemagic Native)
        script: |
          # 4. Codemagic übernimmt das Verpacken. Absolut stabil und zielgerichtet.
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner" \
            --config "Release"
            
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa