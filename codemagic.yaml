workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # Holt exakt das eine benötigte Zertifikat von Apple
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # Trägt das Zertifikat NUR in deine Haupt-App ein, lässt die Plugins aber in Ruhe
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # Der offizielle, saubere Weg: Baut die IPA und generiert die nötigen Export-Optionen selbst
          flutter build ipa --release --export-method=app-store
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa