workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_STORE
      - name: Flutter build iOS
        script: |
          cd flutter_application_1
          flutter build ipa --release
      - name: Upload to App Store Connect / TestFlight
        script: |
          app-store-connect publish --ipa "flutter_application_1/build/ios/ipa/*.ipa"
    artifacts:
      - flutter_application_1/build/ios/ipa/*.ipa