workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
      
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nordwest.aufmassapp
        
    scripts:
      - name: Inject Provisioning Profiles
        script: |
          xcode-project use-profiles
          
      - name: Generate export_options.plist manually
        script: |
          cat <<EOF > $HOME/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          # Der direkte Befehl zum Hochladen der gebauten IPA
          app-store-connect publish --ipa "$(find build/ios/ipa -name "*.ipa")"
    artifacts:
      - build/ios/ipa/*.ipa