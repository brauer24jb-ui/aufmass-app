workflows:
  default-workflow:
    name: Aufmass App Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup (The True Fix)
        script: |
          keychain initialize
          
          # 1. BEIDE Zertifikate laden! (Das Archiv braucht Dev, der Export braucht App Store)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_STORE --create
          
          keychain add-certificates
          
          # 2. RUBY INJECTION: Setzt Xcode sicher auf "Manual", OHNE die Team-ID zu zerstören
          gem install xcodeproj
          cat <<EOF > fix_xcode.rb
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Überschreibt die unsichtbaren Projekt-Attribute auf Manuell
          attributes = project.root_object.attributes['TargetAttributes']
          if attributes
            attributes.each do |target_id, settings|
              settings['ProvisioningStyle'] = 'Manual'
            end
          end
          
          # Zwingt die Build-Settings auf Manuell
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            end
          end
          project.save
          EOF
          ruby fix_xcode.rb
          
          # 3. Codemagic trägt nun die geladenen Zertifikate und die Team-ID fehlerfrei ein
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          # Der Build läuft jetzt absolut widerstandslos durch die zwei Phasen
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa