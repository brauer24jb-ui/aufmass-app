workflows:
  default-workflow:
    name: Aufmass App Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing (The Final Fix)
        script: |
          keychain initialize
          
          # 1. Wir holen NUR das App Store Zertifikat (damit Apple uns wegen Dev-Zertifikat-Limits nicht blockt)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. RUBY INJECTION: Der lückenlose Fix
          gem install xcodeproj
          cat <<EOF > fix_xcode.rb
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # A) Target-Attribute zwingend auf Manuell setzen
          attributes = project.root_object.attributes['TargetAttributes']
          if attributes
            attributes.each do |target_id, settings|
              settings['ProvisioningStyle'] = 'Manual'
            end
          end
          
          # B) HIER FEHLTE DER BEFEHL: Wir zwingen JEDE Konfiguration explizit auf "Apple Distribution"
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            end
          end
          project.save
          EOF
          ruby fix_xcode.rb
          
          # 3. Codemagic sieht jetzt "Apple Distribution" im Code und ordnet das Zertifikat millimetergenau zu
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          # Der Build weiß jetzt exakt, was er tun muss
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa