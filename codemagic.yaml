workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup (The Sniper Fix)
        script: |
          keychain initialize
          
          # 1. Holt die beiden frischen Zertifikate von deinem sauberen Account
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_STORE --create
          keychain add-certificates
          
          # 2. SNIPER HACK: Injiziert die Team-ID punktgenau in den Runner, rettet die Plugins!
          gem install xcodeproj
          cat <<EOF > fix_team.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          
          if project.root_object.attributes['TargetAttributes']
            project.root_object.attributes['TargetAttributes'].each do |t_id, settings|
              settings['DevelopmentTeam'] = 'RX8T7B337M'
            end
          end
          
          project.targets.each do |target|
            if target.name == 'Runner'
              target.build_configurations.each do |config|
                config.build_settings['DEVELOPMENT_TEAM'] = 'RX8T7B337M'
              end
            end
          end
          project.save
          EOF
          ruby fix_team.rb
          
          # 3. Codemagic verbindet nun die Zertifikate fehlerfrei mit dem Projekt
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          # 4. Der Build hat jetzt alle Puzzleteile und baut das finale Archiv
          flutter build ipa --release --export-method=app-store
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa