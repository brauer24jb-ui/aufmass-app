workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # 1. Erschafft die Profile komplett neu auf deinem leeren Apple-Account
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_DEVELOPMENT \
            --create
            
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. Da dein Projekt jetzt sauber auf "Automatic" steht, trägt Codemagic die neuen Profile hier völlig konfliktfrei ein
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # 3. Der Build schnappt sich die frischen Zertifikate und läuft durch
          flutter build ipa --release --export-method=app-store
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa