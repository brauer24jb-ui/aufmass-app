workflows:
  default-workflow:
    name: Aufmass App Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing
        script: |
          keychain initialize
          
          # 1. Wir holen ausschließlich das App Store Profil für den Release
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. Codemagic liest das Profil und verknüpft es automatisch mit deinem Projekt
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # 3. Der offizielle Flutter-Befehl übernimmt das Bauen und Signieren fehlerfrei
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          # 4. Automatischer Upload in den Store
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa