workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing (Clean Standard)
        script: |
          # 1. Schlüsselbund vorbereiten
          keychain initialize
          
          # 2. BEIDE Zertifikate holen (Codemagic nutzt deine Umgebungsvariablen hier automatisch!)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_STORE --create
          
          # 3. Zertifikate installieren
          keychain add-certificates
          
          # 4. Xcode automatisch konfigurieren UND die Export-Datei generieren lassen
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          # Einmal komplett aufräumen, um Altlasten der vorherigen Fehlversuche zu löschen
          flutter clean
          flutter pub get
          
          # Der Build-Befehl nutzt jetzt die von Codemagic perfekt generierte Konfigurationsdatei
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          # Auch hier reicht dieser kurze Befehl, die Credentials werden automatisch erkannt
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa