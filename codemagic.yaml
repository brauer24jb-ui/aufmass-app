workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          # 1. Schlüsselbund auf dem Server initialisieren
          keychain initialize
          
          # 2. Zertifikat holen/erstellen (Codemagic liest deine Secrets hier automatisch!)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          # 3. Zertifikate in den Schlüsselbund packen
          keychain add-certificates
          
          # 4. Xcode zwingen, diese Zertifikate zu nutzen
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter pub get
          # Flutter baut jetzt die App, Xcode findet das Zertifikat dank Schritt 4 sofort
          flutter build ipa --release
          
      - name: Upload to TestFlight
        script: |
          # Automatischer Upload (nutzt ebenfalls automatisch deine Secrets)
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa