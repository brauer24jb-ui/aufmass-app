workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # 1. Holt zwingend BEIDE Zertifikate, damit es keine Lücken für Xcode gibt
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_DEVELOPMENT \
            --create
            
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # 2. Codemagic ordnet die Zertifikate jetzt fehlerfrei zu (kein blindes Raten mehr!)
          xcode-project use-profiles
          
      - name: Create Export Options Plist manually
        script: |
          # 3. Wir erstellen die von Flutter verlangte Datei einfach selbst
          cat <<EOF > $HOME/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # 4. Baut die App sicher mit der manuellen Export-Datei
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa