workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: Code Signing Setup
        script: |
          # 1. Schlüsselbund vorbereiten
          keychain initialize
          
          # 2. Lade Development- UND App Store-Zertifikate (Codemagic nutzt deine Variablen automatisch!)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" --type IOS_APP_STORE --create
          
          # 3. Zertifikate installieren und in Xcode eintragen
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build iOS
        script: |
          flutter pub get
          # Zwingt Flutter, explizit die App Store-Methode zum Exportieren zu nutzen
          flutter build ipa --release --export-method=app-store
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa