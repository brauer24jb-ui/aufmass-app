workflows:
  default-workflow:
    name: Aufmass App Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: Code Signing (Ruby Injection)
        script: |
          # 1. Holt NUR das App Store Zertifikat
          keychain initialize
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          
          # 2. RUBY INJECTION: Schreibt die fehlenden "Manual"-Befehle tief in die Xcode-Struktur!
          gem install xcodeproj
          cat <<EOF > fix_xcode.rb
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              # Diese Zeilen zwingen Xcode auf Manuell, selbst wenn die Einträge vorher fehlten
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['PROVISIONING_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              # Löscht störende alte Einträge, falls vorhanden
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
              config.build_settings.delete('PROVISIONING_PROFILE')
              config.build_settings.delete('DEVELOPMENT_TEAM')
            end
          end
          project.save
          EOF
          ruby fix_xcode.rb
          
          # 3. Trägt das Zertifikat in das nun perfekt präparierte Projekt ein
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa