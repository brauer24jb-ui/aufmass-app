workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    
    integrations:
      app_store_connect: Nordwest
      
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nordwest.aufmassapp
        
    scripts:
      - name: Inject Provisioning Profiles
        script: |
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          # Hier ist der magische Befehl: Wir nutzen die von Codemagic generierte Datei!
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true