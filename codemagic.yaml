workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # 1. Wir erstellen ein frisches Development-Zertifikat (damit Flutters interner Check glücklich ist)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_DEVELOPMENT \
            --create
          
          # 2. Wir erstellen das frische App Store-Zertifikat (für den TestFlight-Upload)
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # Codemagic ordnet die frischen Zertifikate jetzt deinem reparierten Projekt zu
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          # Der Standard-Befehl funktioniert jetzt, weil die Schlüssel im Apple-Konto endlich sauber sind!
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa