workflows:
  default-workflow:
    name: Aufmass App TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      flutter: stable
    scripts:
      - name: iOS Code Signing Setup
        script: |
          keychain initialize
          
          # Erstellt die Zertifikate frisch auf deinem sauberen Apple-Account
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_DEVELOPMENT \
            --create
            
          app-store-connect fetch-signing-files "com.nordwest.aufmassapp" \
            --type IOS_APP_STORE \
            --create
            
          keychain add-certificates
          
          # Codemagic trägt die frischen Zertifikate in dein repariertes "Automatic" Projekt ein
          xcode-project use-profiles
          
      - name: Flutter build iOS
        script: |
          flutter clean
          flutter pub get
          
          # Der Build nutzt die von Codemagic generierte Export-Datei
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist
          
      - name: Upload to TestFlight
        script: |
          app-store-connect publish --ipa "build/ios/ipa/*.ipa"
    artifacts:
      - build/ios/ipa/*.ipa